name: Release

on:
  push:
    tags: ['v*']

# Builds the universal app, signs it with Laldinsoft's Developer ID, notarizes
# the app and its disk image, and publishes TradingClock.dmg to a GitHub Release.
# The tag must match CFBundleShortVersionString in Resources/Info.plist.
permissions:
  contents: write

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version." >&2
            exit 1
          fi

      - name: Install the signing certificate and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign and notarize
        env:
          TRADING_CLOCK_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          TRADING_CLOCK_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          TRADING_CLOCK_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/release.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Trading Clock $version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/TradingClock.dmg dist/TradingClock.dmg.sha256 \
            --title "Trading Clock $version" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing keychain and notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
